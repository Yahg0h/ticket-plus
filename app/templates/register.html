{% extends "base.html" %}

{% block title %}Cadastro - TicketPlus{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-7">
        <div class="card shadow">
            <div class="card-body">
                <h1 class="card-title text-center mb-4">Crie sua Conta 🎫</h1>
                
                <form method="POST" action="/auth/register">
                    <!-- Nome -->
                    <div class="mb-3">
                        <label for="name" class="form-label">Nome Completo</label>
                        <input 
                            type="text" 
                            class="form-control" 
                            id="name" 
                            name="name" 
                            placeholder="Seu nome completo"
                            required
                        >
                    </div>

                    <!-- CPF -->
                    <div class="mb-3">
                        <label for="cpf" class="form-label">CPF</label>
                        <input 
                            type="text" 
                            class="form-control" 
                            id="cpf" 
                            name="cpf" 
                            placeholder="000.000.000-00"
                            required
                        >
                        <small class="form-text text-muted">Digite sem formatação ou com pontos e hífen</small>
                    </div>

                    <!-- Email (Opcional) -->
                    <div class="mb-3">
                        <label for="email" class="form-label">Email (Opcional)</label>
                        <input 
                            type="email" 
                            class="form-control" 
                            id="email" 
                            name="email" 
                            placeholder="seu@email.com"
                        >
                        <small class="form-text text-muted">Você deve informar email ou telefone</small>
                    </div>

                    <!-- Telefone (Opcional) -->
                    <div class="mb-3">
                        <label for="phone_number" class="form-label">Telefone (Opcional)</label>
                        <input 
                            type="tel" 
                            class="form-control" 
                            id="phone_number" 
                            name="phone_number" 
                            placeholder="(11) 99999-9999"
                        >
                        <small class="form-text text-muted">Você deve informar email ou telefone</small>
                    </div>

                    <!-- Estado -->
                    <div class="mb-3">
                        <label for="state" class="form-label">Estado</label>
                        <select 
                            class="form-select" 
                            id="state" 
                            name="state" 
                            required
                        >
                            <option value="">Selecione seu estado</option>
                            <!-- Estados serão preenchidos via JavaScript -->
                        </select>
                    </div>

                    <!-- Cidade -->
                    <div class="mb-3">
                        <label for="city" class="form-label">Cidade</label>
                        <select 
                            class="form-select" 
                            id="city" 
                            name="city" 
                            required
                            disabled
                        >
                            <option value="">Selecione sua cidade</option>
                        </select>
                    </div>

                    <!-- Senha -->
                    <div class="mb-3">
                        <label for="password" class="form-label">Senha</label>
                        <input 
                            type="password" 
                            class="form-control" 
                            id="password" 
                            name="password" 
                            placeholder="Senha segura (mínimo 6 caracteres)"
                            minlength="6"
                            required
                        >
                    </div>

                    <!-- Botão Cadastro -->
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success btn-lg">Criar Conta</button>
                    </div>
                </form>

                <!-- Link para Login -->
                <div class="text-center mt-3">
                    <p>Já tem conta? <a href="/auth/login">Faça login aqui</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Script para carregar estados e cidades do brasil-states-cities.json -->
<script>
    let brazilData = {};

    // Carregar dados de estados e cidades
    fetch('/static/brazil-states-cities.json')
        .then(response => response.json())
        .then(data => {
            brazilData = data.BR.states;
            populateStates();
        })
        .catch(error => console.error('Erro ao carregar dados:', error));

    // Preencher dropdown de estados
    function populateStates() {
        const stateSelect = document.getElementById('state');
        const states = Object.keys(brazilData).sort();

        states.forEach(stateCode => {
            const option = document.createElement('option');
            option.value = stateCode;
            option.textContent = brazilData[stateCode].name;
            stateSelect.appendChild(option);
        });
    }

    // Atualizar cidades quando estado mudar
    document.getElementById('state').addEventListener('change', function() {
        const stateCode = this.value;
        const citySelect = document.getElementById('city');
        
        // Limpar cidades anteriores
        citySelect.innerHTML = '<option value="">Selecione sua cidade</option>';
        citySelect.disabled = true;

        if (stateCode && brazilData[stateCode]) {
            const cities = brazilData[stateCode].cities || [];
            cities.forEach(city => {
                const option = document.createElement('option');
                option.value = city;
                option.textContent = city;
                citySelect.appendChild(option);
            });
            citySelect.disabled = false;
        }
    });
</script>
{% endblock %}
