{% extends "base.html" %}

{% block title %}Entrar - TicketPlus{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body">
                <h1 class="card-title text-center mb-4">Bem-vindo de volta! 🎫</h1>
                
                <form method="POST" action="/auth/login">
                    <!-- CSRF Token -->
                    <input type="hidden" name="csrf_token" value="{{ request.session.get('csrf_token', '') }}">

                    <!-- Email ou Telefone -->
                    <div class="mb-3">
                        <label for="email" class="form-label">Email ou Telefone</label>
                        <input 
                            type="text" 
                            class="form-control" 
                            id="email" 
                            name="email" 
                            placeholder="seu@email.com ou (11) 99999-9999"
                            required
                        >
                        <small class="form-text text-muted">Use seu email ou telefone cadastrado</small>
                    </div>

                    <!-- Senha -->
                    <div class="mb-3">
                        <label for="password" class="form-label">Senha</label>
                        <input 
                            type="password" 
                            class="form-control" 
                            id="password" 
                            name="password" 
                            placeholder="Sua senha segura"
                            required
                        >
                    </div>

                    <!-- Botão Entrar -->
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
                    </div>
                </form>

                <!-- Link para Cadastro -->
                <div class="text-center mt-3">
                    <p>Não tem conta? <a href="/auth/register">Cadastre-se aqui</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
