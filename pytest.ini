[pytest]
# Pytest configuration for TicketPlus

# Test directory
testpaths = tests

# Test file name pattern
python_files = test_*.py

# Test function name pattern
python_functions = test_*

# Asyncio mode
asyncio_mode = auto

# Verbosity
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Custom markers
markers =
    asyncio: mark tests as asynchronous
    integration: mark integration tests
    unit: mark unit tests
    slow: mark slow tests